<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Форма привітання</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 40px 16px;
        }
        form {
            max-width: 380px;
            margin: 0 auto;
            padding: 24px;
            background: #fff;
            border: 1px solid #d5dbe1;
            border-radius: 8px;
        }
        h1 { font-size: 22px; margin-top: 0; }
        label { display: block; margin: 14px 0 6px; font-weight: bold; }
        input[type="text"] {
            width: 100%;
            padding: 9px;
            border: 1px solid #b7c0c9;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            color: #fff;
            background: #2b6cb0;
            border: 0;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background: #245a94; }
    </style>
</head>
<body>
    <!-- Дані відправляються методом POST у файл process.php -->
    <form action="process.php" method="post">
        <h1>Введіть свої дані</h1>

        <label for="name">Ім'я</label>
        <input type="text" id="name" name="name" placeholder="Іван">

        <label for="surname">Прізвище</label>
        <input type="text" id="surname" name="surname" placeholder="Петренко">

        <button type="submit">Отримати привітання</button>
    </form>
</body>
</html>
